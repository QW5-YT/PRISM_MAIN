<style>

@keyframes backdropSweep{0%,12%{transform:rotate(-18deg) translate3d(0,-120vh,0);opacity:0}22%{opacity:1}58%{opacity:.55}78%,100%{transform:rotate(-18deg) translate3d(0,150vh,0);opacity:0}}@keyframes borderShimmer{0%,15%{background-position:130% 0}60%,100%{background-position:-130% 0}}@keyframes prismPulse{0%,78%,100%{text-shadow:0 0 0 #fff0}86%{text-shadow:0 0 15px #fff9,0 0 32px #fff4}}@keyframes logoArrival{from{opacity:0;filter:blur(14px);transform:translateY(20px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes letterArrival{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes searchArrival{from{opacity:0;filter:blur(7px);transform:translateY(17px) scale(.97)}to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}@keyframes navReveal{from{opacity:0;translate:0 -8px}to{opacity:1;translate:0 0}}@keyframes twinkle{from{opacity:.08;transform:scale(.65)}to{opacity:.8;transform:scale(1.5)}}@keyframes hazeDrift{from{transform:translate(-5%,-4%) scale(.8)}to{transform:translate(14%,12%) scale(1.15)}}@keyframes trailFloat{from{margin-left:-1.5%;margin-top:-1%}to{margin-left:2%;margin-top:2%}}@keyframes lightTravel{from{transform:translateX(-60vw);opacity:0}15%{opacity:.8}85%{opacity:.8}to{transform:translateX(100vw);opacity:0}}@keyframes crystalDrift{from{translate:-8px -10px;rotate:-5deg}to{translate:12px 15px;rotate:6deg}}

/* Preferences page */
.page-view.settings-page{max-height:calc(100svh - 100px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#444 transparent}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px;padding-bottom:28px}
.setting-card{min-width:0;padding:20px;border:1px solid #ffffff18;border-radius:15px;background:linear-gradient(135deg,#ffffff09,#ffffff03);backdrop-filter:blur(8px)}

.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.setting-toggle[aria-pressed="true"]{background:var(--accent,#eee);border-color:var(--accent,#eee)}

.setting-toggle:focus-visible,.accent-choice:focus-visible,.setting-action:focus-visible{outline:2px solid var(--accent,#fff);outline-offset:4px}

.accent-choice[aria-pressed="true"]{outline:1px solid var(--swatch)}
.setting-action{margin-top:15px;padding:9px 12px;border:1px solid #ffffff25;border-radius:9px;background:#ffffff08;color:#eee;font-size:12px;cursor:pointer;transition:background .2s}
.setting-action:hover{background:#ffffff15}

<h1 class="logo" aria-label="PRISM"><span>P</span><span>R</span><span>I</span><span>S</span><span>M</span></h1>
<form class="search" id="searchForm" role="search">
<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16 16 4.2 4.2"/></svg>

</form>

<div class="browser-home-links" aria-label="PRISM pages"><button type="button" data-prism="prism://games">🎮 Games</button><button type="button" data-prism="prism://apps">▦ Apps</button><button type="button" data-prism="prism://chat">☏ Chat</button><button type="button" data-prism="prism://account">◉ Account</button><button type="button" data-prism="prism://settings">⚙ Settings</button></div>
<p class="browser-home-note">PRISM BROWSER · TYPE A URL OR SEARCH THE WEB</p>
</section>
</main>
<script>

const addressForm=document.getElementById("browserAddressForm");
const addressInput=document.getElementById("browserAddress");
const internalRoutes={"new-tab":"Home","home":"Home","games":"Games","apps":"Apps","chat":"Chat","settings":"Settings","account":"Account","ai":"AI"};
let browserHistory=["prism://new-tab"],browserHistoryIndex=0;
function setAddress(value){if(addressInput)addressInput.value=value}
function routeInternal(route,push=true){
 const clean=route.toLowerCase().replace(/^prism:\/\//,"").split(/[/?#]/)[0]||"new-tab";
 const section=internalRoutes[clean];
 if(!section)return false;
 if(push){browserHistory=browserHistory.slice(0,browserHistoryIndex+1);browserHistory.push("prism://"+clean);browserHistoryIndex=browserHistory.length-1}
 setAddress("prism://"+clean);
 const center=document.querySelector(".center");
 let page=document.getElementById("pageView");
 if(section==="Home"){if(center){center.hidden=false;center.classList.add("new-tab-center")}if(page)page.hidden=true;return true}
 if(!page){page=document.createElement("section");page.id="pageView";page.className="page-view";page.setAttribute("aria-live","polite");page.hidden=true;document.querySelector(".scene").appendChild(page)}
 if(section==="Settings"){page.className="page-view settings-page";page.innerHTML=settingsMarkup();applyPreferences()}
 else if(section==="Games"){page.className="page-view games-page";page.innerHTML='<p class="page-kicker">PRISM / ARCADE</p><h1 class="page-title">Games</h1><div class="page-rule"></div><a class="internal-game-link" href="/games/trap-the-cat.html"><span class="internal-game-icon">◉</span><span><strong>Trap the Cat</strong><small>Outsmart the cat and block its escape.</small></span><span class="internal-game-arrow">↗</span></a>'}
 else{page.className="page-view";page.innerHTML='<p class="page-kicker">PRISM / INTERNAL</p><h1 class="page-title">'+section+'</h1><div class="page-rule"></div><div class="empty-state"><div class="empty-mark" aria-hidden="true">✧</div><h2>'+({Apps:"Your apps live here",Chat:"Chat is coming soon",Account:"Your account",AI:"AI is not enabled yet"})[section]+'</h2><p>This is a PRISM internal page. Use the address bar to navigate anywhere.</p></div>'}
 if(center)center.hidden=true;page.hidden=false;return true
}
function browserNavigate(value,push=true){
 const raw=(value||"").trim();if(!raw)return;
 if(/^prism:\/\//i.test(raw)){if(routeInternal(raw,push))return;setAddress(raw);const status=document.getElementById("browseStatus");if(status)status.textContent="Unknown PRISM page. Try prism://new-tab, prism://games, prism://apps, prism://chat, prism://settings, or prism://account.";return}
 const queryLike=/\s/.test(raw)&&!/^https?:\/\//i.test(raw);
 let target=queryLike?"https://www.google.com/search?q="+encodeURIComponent(raw):(/^[a-z][a-z\d+.-]*:/i.test(raw)?raw:"https://"+raw);
 if(!/^https?:/i.test(target)){target="https://www.google.com/search?q="+encodeURIComponent(raw)}
 setAddress(target);
 if(push){browserHistory=browserHistory.slice(0,browserHistoryIndex+1);browserHistory.push(target);browserHistoryIndex=browserHistory.length-1}
 const center=document.querySelector(".center");if(center)center.hidden=true;
 let page=document.getElementById("pageView");if(!page){page=document.createElement("section");page.id="pageView";page.className="page-view";page.hidden=true;document.querySelector(".scene").appendChild(page)}
 page.className="page-view browse-page";page.innerHTML=window.prismBrowseMarkup();page.hidden=false;
 if(window.prismBrowseOpen)window.prismBrowseOpen(target);
}
addressForm.addEventListener("submit",e=>{e.preventDefault();browserNavigate(addressInput.value)});
document.getElementById("browserNewTab").addEventListener("click",()=>browserNavigate("prism://new-tab"));
document.getElementById("browserReload").addEventListener("click",()=>{const current=browserHistory[browserHistoryIndex]||"prism://new-tab";if(current.startsWith("prism://"))browserNavigate(current,false);else if(window.prismBrowseOpen)window.prismBrowseOpen(current)});
document.getElementById("browserBack").addEventListener("click",()=>{if(browserHistoryIndex>0){browserHistoryIndex--;const previous=browserHistory[browserHistoryIndex];if(previous.startsWith("prism://"))routeInternal(previous,false);else{setAddress(previous);const center=document.querySelector(".center");if(center)center.hidden=true;let page=document.getElementById("pageView");if(!page){page=document.createElement("section");page.id="pageView";page.className="page-view";document.querySelector(".scene").appendChild(page)}page.className="page-view browse-page";page.innerHTML=window.prismBrowseMarkup();page.hidden=false;if(window.prismBrowseOpen)window.prismBrowseOpen(previous)}}});
document.addEventListener("click",e=>{const shortcut=e.target.closest("[data-prism]");if(shortcut)browserNavigate(shortcut.dataset.prism)});
const stars=document.getElementById("stars");
for(let i=0;i<48;i++){const star=document.createElement("span");star.className="star";star.style.setProperty("--x",Math.random()*100+"%");star.style.setProperty("--y",Math.random()*100+"%");star.style.setProperty("--size",(Math.random()*2+1)+"px");star.style.setProperty("--duration",(2.5+Math.random()*6)+"s");star.style.setProperty("--delay",(-Math.random()*8)+"s");stars.appendChild(star)}
const form=document.getElementById("searchForm"),input=document.getElementById("search"),feedback=document.getElementById("feedback");
form.addEventListener("submit",event=>{event.preventDefault();const query=input.value.trim().toLowerCase();if(!query){input.focus();return}browserNavigate(query)});
input.addEventListener("input",()=>feedback.classList.remove("show"));
document.addEventListener("keydown",event=>{const target=event.target;const typing=target instanceof HTMLElement&&(target.matches("input, textarea, select")||target.isContentEditable);if(event.key==="/"&&!typing&&preferences.shortcut){event.preventDefault();input.focus()}if(event.key==="Escape"){input.value="";feedback.classList.remove("show");input.blur()}});

const navButtons=[];
const center=document.querySelector(".center");
const preferenceDefaults={animations:true,stars:true,glow:true,accent:"white",shortcut:true};
let preferences={...preferenceDefaults};
try{preferences={...preferenceDefaults,...JSON.parse(localStorage.getItem("prism-preferences")||"{}")}}catch{}
function savePreferences(){try{localStorage.setItem("prism-preferences",JSON.stringify(preferences))}catch{}}
function applyPreferences(){
 document.body.classList.toggle("motion-off",!preferences.animations);document.body.classList.toggle("stars-off",!preferences.stars);document.body.classList.toggle("low-glow",!preferences.glow);
 const accents={white:"#f4f4f4",ice:"#9cecff",violet:"#c7a6ff",lime:"#b9f77b"};document.documentElement.style.setProperty("--accent",accents[preferences.accent]||accents.white);
 document.querySelectorAll(".accent-choice").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.accent===preferences.accent)));document.querySelectorAll("[data-pref]").forEach(b=>b.setAttribute("aria-pressed",String(!!preferences[b.dataset.pref])));
}
function settingsMarkup(){return '<p class="page-kicker">PERSONALIZE YOUR EXPERIENCE</p><h1 class="page-title">Settings</h1><div class="page-rule"></div><div class="settings-grid"><section class="setting-card"><div class="setting-row"><div><h2>Ambient animations</h2><p>Pause the moving crystals, shimmer, and background effects.</p></div><button class="setting-toggle" type="button" data-pref="animations" aria-label="Toggle ambient animations" aria-pressed="true"></button></div></section><section class="setting-card"><div class="setting-row"><div><h2>Starfield</h2><p>Show or hide the tiny twinkling stars in the background.</p></div><button class="setting-toggle" type="button" data-pref="stars" aria-label="Toggle starfield" aria-pressed="true"></button></div></section><section class="setting-card"><div class="setting-row"><div><h2>Glow effects</h2><p>Turn down the bright glow and haze for a calmer look.</p></div><button class="setting-toggle" type="button" data-pref="glow" aria-label="Toggle glow effects" aria-pressed="true"></button></div></section><section class="setting-card"><h2>Accent color</h2><p>Choose the highlight color used around the interface.</p><div class="accent-options"><button class="accent-choice" style="--swatch:#f4f4f4" data-accent="white" aria-label="White accent" aria-pressed="true"></button><button class="accent-choice" style="--swatch:#9cecff" data-accent="ice" aria-label="Ice blue accent" aria-pressed="false"></button><button class="accent-choice" style="--swatch:#c7a6ff" data-accent="violet" aria-label="Violet accent" aria-pressed="false"></button><button class="accent-choice" style="--swatch:#b9f77b" data-accent="lime" aria-label="Lime accent" aria-pressed="false"></button></div></section><section class="setting-card"><div class="setting-row"><div><h2>Quick search shortcut</h2><p>Use the / key to jump straight to the game search.</p></div><button class="setting-toggle" type="button" data-pref="shortcut" aria-label="Toggle quick search shortcut" aria-pressed="true"></button></div></section><section class="setting-card"><h2>Reset preferences</h2><p>Restore the default PRISM appearance and behavior.</p><button class="setting-action" type="button" data-reset-settings>Reset to defaults</button></section></div><p class="setting-note">Your preferences are saved on this device in this browser.</p>'}
applyPreferences();
document.addEventListener("click",event=>{
 const toggle=event.target.closest("[data-pref]"),accent=event.target.closest("[data-accent]"),reset=event.target.closest("[data-reset-settings]");
 if(toggle){preferences[toggle.dataset.pref]=!preferences[toggle.dataset.pref];savePreferences();applyPreferences()}
 if(accent){preferences.accent=accent.dataset.accent;savePreferences();applyPreferences()}
 if(reset){preferences={...preferenceDefaults};savePreferences();applyPreferences()}
});
document.addEventListener("keydown",event=>{const target=event.target;const typing=target instanceof HTMLElement&&(target.matches("input, textarea, select")||target.isContentEditable);if(event.key==="/"&&!typing&&preferences.shortcut){event.preventDefault();addressInput.focus()}});
routeInternal("prism://new-tab",false);
</script>
<script src="/js/browse.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 59 48 32 60 5 48Z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M32 4v56M5 48l27-17 27 17M32 31 19 26 32 4 45 26Z' fill='white' fill-opacity='.15' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
<title>PRISM</title>
<style>
:root{--bg:#030303;--fg:#f7f7f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Arial,sans-serif}body{min-height:100svh;overflow:hidden}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:5px}
.scene{position:relative;isolation:isolate;width:100%;min-height:100svh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 44%,#151515 0%,#090909 31%,#030303 73%)}
/* Slow, transform-only light pass across the backdrop. */
.scene:after{content:"";position:absolute;z-index:-1;pointer-events:none;left:-35%;top:-15%;width:170%;height:1px;background:linear-gradient(90deg,transparent,#ffffff20,transparent);box-shadow:0 0 28px 2px #ffffff08;transform:rotate(-18deg) translate3d(0,-120vh,0);animation:backdropSweep 18s ease-in-out infinite}
.ambient{position:absolute;inset:0;z-index:-2;overflow:hidden;pointer-events:none}.haze{position:absolute;width:45vw;height:45vw;border-radius:50%;background:#fff;filter:blur(120px);opacity:.035;animation:hazeDrift 16s ease-in-out infinite alternate}.haze.a{left:-20%;top:-30%}.haze.b{right:-20%;bottom:-35%;animation-delay:-8s}.stars{position:absolute;inset:0}.star{position:absolute;width:var(--size);height:var(--size);left:var(--x);top:var(--y);border-radius:50%;background:white;opacity:.25;box-shadow:0 0 9px 2px #fff2;animation:twinkle var(--duration) ease-in-out var(--delay) infinite alternate}
.trail{position:absolute;width:125vw;height:56vw;min-height:300px;border:1px solid #ffffff16;border-radius:50%;left:-30%;top:-9%;transform:rotate(-23deg);animation:trailFloat 18s ease-in-out infinite alternate}.trail:after{content:"";position:absolute;width:32%;height:1px;left:22%;top:-1px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #fff;animation:lightTravel 8s linear infinite}.trail.two{width:125vw;height:43vw;left:-15%;top:43%;transform:rotate(19deg);animation-duration:23s;animation-direction:alternate-reverse}.trail.two:after{animation-delay:-4s;animation-duration:11s}
.crystal{position:absolute;width:var(--w);aspect-ratio:1;left:var(--x);top:var(--y);opacity:var(--opacity);filter:drop-shadow(0 0 14px #ffffff15);animation:crystalDrift var(--duration) ease-in-out var(--delay) infinite alternate;transform-origin:center}.crystal svg{display:block;width:100%;height:100%;overflow:visible}.crystal polygon,.crystal path{stroke:#e7e7e7;stroke-width:.65;stroke-linejoin:round}.facet1{fill:url(#facetA)}.facet2{fill:url(#facetB)}.facet3{fill:url(#facetC)}.facet4{fill:url(#facetD)}.edge{fill:none;stroke:#fff;stroke-width:.7;opacity:.75}.crystal.small{filter:drop-shadow(0 0 6px #fff3)}
.navbar{position:absolute;z-index:5;top:0;left:0;transform:none;display:flex;align-items:center;justify-content:center;gap:clamp(15px,3vw,38px);width:100%;min-height:68px;padding:10px 20px;border-bottom:1px solid #ffffff12;background:#070707a8;backdrop-filter:blur(14px);animation:navReveal 1s .4s both}.brand{position:absolute;left:clamp(16px,3vw,34px);display:flex;align-items:center;gap:9px;color:#f5f5f5;font-size:12px;font-weight:600;letter-spacing:.22em;white-space:nowrap}.brand-mark{width:25px;height:29px;filter:drop-shadow(0 0 7px #ffffff30)}.navbar button{position:relative;padding:8px 10px;color:#888;background:transparent;border:0;border-radius:20px;font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:color .3s ease}.nav-icon{width:14px;height:14px;margin-right:6px;vertical-align:-3px;opacity:.72;transition:opacity .25s ease,transform .25s ease}.navbar button:hover .nav-icon,.navbar button.active .nav-icon{opacity:1}.navbar button:hover .nav-icon{transform:translateY(-1px)}.navbar button:before{content:"";position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse at center,#ffffff14,transparent 72%);opacity:0;transform:scale(.7);transition:opacity .25s ease,transform .3s ease}.navbar button:after{content:"";position:absolute;bottom:3px;left:50%;width:0;height:1px;background:white;box-shadow:0 0 8px #fff9;transform:translateX(-50%);transition:width .3s ease}.navbar button:hover:before{opacity:1;transform:scale(1)}.navbar button:hover{color:white}.navbar button:hover:after{width:100%}.navbar button.active{color:#fff}.navbar button.active:after{width:70%}.center[hidden]{display:none!important}
.page-view{position:relative;z-index:2;width:min(760px,88vw);margin:110px auto 0;animation:pageEnter .55s cubic-bezier(.16,1,.3,1) both}.page-kicker{margin:0 0 12px;color:#777;font-size:10px;letter-spacing:.24em;text-transform:uppercase}.page-title{margin:0;color:#f4f4f4;font-size:clamp(30px,5vw,48px);font-weight:400;letter-spacing:-.035em}.page-rule{height:1px;margin:25px 0 0;background:linear-gradient(90deg,#ffffff55,#ffffff10 70%,transparent)}.empty-state{min-height:190px;margin-top:26px;padding:35px 28px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(135deg,#ffffff08,#ffffff02);box-shadow:0 18px 70px #0005;backdrop-filter:blur(8px)}.empty-mark{width:34px;height:34px;margin-bottom:18px;display:grid;place-items:center;border:1px solid #ffffff28;border-radius:10px;color:#cfcfcf;font-size:18px}.empty-state h2{margin:0 0 9px;color:#e8e8e8;font-size:17px;font-weight:500;letter-spacing:.01em}.empty-state p{max-width:430px;margin:0;color:#888;font-size:13px;line-height:1.7}.page-view[hidden]{display:none!important}@keyframes pageEnter{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.center{position:relative;z-index:2;width:min(700px,88vw);display:flex;flex-direction:column;align-items:center;transform:translateY(-4vh)}.logo{display:flex;justify-content:center;margin:0 0 43px;padding-left:.26em;font-family:"Arial",sans-serif;font-size:clamp(46px,8vw,82px);line-height:1;font-weight:500;letter-spacing:.26em;text-shadow:0 0 9px #fff7,0 0 32px #fff3;animation:logoArrival 1.5s cubic-bezier(.16,1,.3,1) both;user-select:none}.logo span{display:inline-block;animation:letterArrival 1.2s cubic-bezier(.16,1,.3,1) both,prismPulse 7s ease-in-out 1.8s infinite}.logo span:nth-child(1){animation-delay:.08s}.logo span:nth-child(2){animation-delay:.15s}.logo span:nth-child(3){animation-delay:.22s}.logo span:nth-child(4){animation-delay:.29s}.logo span:nth-child(5){animation-delay:.36s}.logo:hover span{ text-shadow:0 0 18px #fff9; }.logo:hover span:nth-child(odd){transform:translateY(-2px)}.logo:hover span:nth-child(even){transform:translateY(2px)}
.search{position:relative;width:min(670px,100%);height:82px;display:flex;align-items:center;border:1px solid #dedede;border-radius:100px;background:#050505b8;box-shadow:0 0 0 1px #ffffff08,0 0 28px #ffffff08,inset 0 0 25px #ffffff03;backdrop-filter:blur(12px);animation:searchArrival 1.2s .2s cubic-bezier(.16,1,.3,1) both;transition:box-shadow .45s ease,background .45s ease,border-color .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}.search:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#ffffff70 43%,#ffffff12 50%,transparent 65%);background-size:240% 100%;background-position:100% 0;opacity:.48;animation:borderShimmer 9s ease-in-out infinite;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}.search:focus-within:before{opacity:.9;animation-duration:3.5s}.search:focus-within{border-color:white;background:#101010e8;box-shadow:0 0 0 5px #ffffff07,0 0 45px #ffffff16,inset 0 0 20px #ffffff05;transform:scale(1.012)}.search-icon{width:22px;height:22px;margin-left:29px;flex:0 0 auto;opacity:.95;transition:transform .3s ease}.search:focus-within .search-icon{transform:scale(1.1)}#search{width:100%;height:100%;padding:0 15px 0 27px;min-width:0;border:0;outline:0;color:white;background:transparent;font-size:16px}#search::placeholder{color:#929292}.go{flex:0 0 auto;width:54px;height:54px;margin-right:9px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff22;background:#ffffff0b;cursor:pointer;transition:background .3s ease,transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s ease}.go svg{width:23px;height:23px;transition:transform .3s ease}.go:hover{background:white;border-color:white;transform:rotate(-4deg)}.go:hover svg{stroke:#050505;transform:translateX(2px)}.go:active{transform:scale(.9)}
.feedback{position:absolute;top:calc(100% + 18px);left:0;width:100%;color:#aaa;text-align:center;font-size:12px;line-height:1.7;opacity:0;transform:translateY(-5px);pointer-events:none;transition:opacity .3s ease,transform .3s ease}.feedback.show{opacity:1;transform:translateY(0)}
@keyframes backdropSweep{0%,12%{transform:rotate(-18deg) translate3d(0,-120vh,0);opacity:0}22%{opacity:1}58%{opacity:.55}78%,100%{transform:rotate(-18deg) translate3d(0,150vh,0);opacity:0}}@keyframes borderShimmer{0%,15%{background-position:130% 0}60%,100%{background-position:-130% 0}}@keyframes prismPulse{0%,78%,100%{text-shadow:0 0 0 #fff0}86%{text-shadow:0 0 15px #fff9,0 0 32px #fff4}}@keyframes logoArrival{from{opacity:0;filter:blur(14px);transform:translateY(20px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes letterArrival{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes searchArrival{from{opacity:0;filter:blur(7px);transform:translateY(17px) scale(.97)}to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}@keyframes navReveal{from{opacity:0;translate:0 -8px}to{opacity:1;translate:0 0}}@keyframes twinkle{from{opacity:.08;transform:scale(.65)}to{opacity:.8;transform:scale(1.5)}}@keyframes hazeDrift{from{transform:translate(-5%,-4%) scale(.8)}to{transform:translate(14%,12%) scale(1.15)}}@keyframes trailFloat{from{margin-left:-1.5%;margin-top:-1%}to{margin-left:2%;margin-top:2%}}@keyframes lightTravel{from{transform:translateX(-60vw);opacity:0}15%{opacity:.8}85%{opacity:.8}to{transform:translateX(100vw);opacity:0}}@keyframes crystalDrift{from{translate:-8px -10px;rotate:-5deg}to{translate:12px 15px;rotate:6deg}}
@media(max-width:600px){.brand{left:8px;gap:0}.brand span{display:none}.brand-mark{width:20px;height:24px}.navbar{top:0;min-height:62px;padding:8px 7px 8px 35px;gap:clamp(5px,2vw,12px)}.page-view{margin-top:92px}.page-rule{margin-top:20px}.empty-state{min-height:170px;padding:26px 22px}.navbar button{padding-left:6px;padding-right:6px}.navbar{top:0;gap:clamp(5px,2vw,12px)}.navbar button{font-size:10px;letter-spacing:0}.center{width:88vw;transform:translateY(-3vh)}.logo{font-size:clamp(37px,9vw,54px);margin-bottom:34px;letter-spacing:.2em}.search{height:64px}.search-icon{margin-left:21px;width:20px;height:20px}#search{padding-left:16px;font-size:14px}.go{width:44px;height:44px;margin-right:7px}.crystal{opacity:calc(var(--opacity)*.65)}}@media(max-width:370px){.navbar{gap:9px}.navbar button{font-size:9px}.logo{font-size:35px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
<nav class="navbar" aria-label="Main navigation">
<div class="brand" aria-label="PRISM"><svg class="brand-mark" viewBox="0 0 32 38" fill="none" aria-hidden="true"><path d="M16 1.5 30 27 16 36.5 2 27Z" stroke="currentColor" stroke-width="1.4"/><path d="M16 1.5V36.5M2 27l14-9 14 9M16 18 9.2 14 16 1.5 22.8 14Z" stroke="currentColor" stroke-width="1.1" fill="currentColor" fill-opacity=".13"/></svg><span>PRISM</span></div>
<button type="button" data-section="Home" aria-current="page" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>Home</button><button type="button" data-section="Games"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 8h10a4 4 0 0 1 3.8 5.3l-1.2 3.5a2 2 0 0 1-3.2.9L13.8 15h-3.6l-2.6 2.7a2 2 0 0 1-3.2-.9l-1.2-3.5A4 4 0 0 1 7 8Z"/><path d="M7 10v4m-2-2h4m7-1h.01M17 13h.01"/></svg>Games</button><button type="button" data-section="Apps"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Apps</button><button type="button" data-section="Chat"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>Chat</button><button type="button" data-section="Settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"/></svg>Settings</button><button type="button" data-section="Account"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Account</button><button type="button" data-section="AI"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M4.9 4.9l2.8 2.8m8.6 8.6 2.8 2.8m0-14.2-2.8 2.8m-8.6 8.6-2.8 2.8"/><circle cx="12" cy="12" r="5"/></svg>AI</button>
</nav>
<div class="ambient" aria-hidden="true">
<div class="haze a"></div><div class="haze b"></div><div class="trail"></div><div class="trail two"></div><div class="stars" id="stars"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
<linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#aaa" stop-opacity=".02"/></linearGradient>
<linearGradient id="facetC" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ddd" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".65"/></linearGradient>
<linearGradient id="facetD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".02"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
</defs></svg>
<div class="crystal" style="--w:310px;--x:75%;--y:-9%;--opacity:.68;--duration:13s;--delay:-3s"><svg viewBox="0 0 200 200"><polygon class="facet1" points="100,4 195,120 122,145"/><polygon class="facet2" points="100,4 122,145 24,128"/><polygon class="facet3" points="100,4 24,128 70,190"/><polygon class="facet4" points="24,128 122,145 70,190"/><polygon class="facet2" points="122,145 195,120 70,190"/><path class="edge" d="M100 4 122 145 24 128 100 4 70 190 122 145 195 120"/></svg></div>
<div class="crystal" style="--w:330px;--x:-10%;--y:54%;--opacity:.48;--duration:17s;--delay:-6s"><svg viewBox="0 0 200 200"><polygon class="facet1" points="0,20 185,100 90,145"/><polygon class="facet3" points="0,20 90,145 20,195"/><polygon class="facet2" points="185,100 90,145 140,195"/><polygon class="facet4" points="90,145 20,195 140,195"/><path class="edge" d="M0 20 185 100 90 145 20 195 0 20 M90 145 140 195 185 100"/></svg></div>
<div class="crystal small" style="--w:88px;--x:18%;--y:18%;--opacity:.62;--duration:8s;--delay:-2s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="50,3 96,75 58,65"/><polygon class="facet3" points="50,3 58,65 4,76"/><polygon class="facet2" points="4,76 58,65 40,97"/><path class="edge" d="M50 3 58 65 4 76 50 3 40 97 58 65 96 75"/></svg></div>
<div class="crystal small" style="--w:66px;--x:79%;--y:72%;--opacity:.65;--duration:10s;--delay:-4s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="8,26 91,13 65,88"/><polygon class="facet3" points="8,26 65,88 18,76"/><polygon class="facet2" points="91,13 65,88 18,76"/><path class="edge" d="M8 26 91 13 65 88 18 76 8 26"/></svg></div>
<div class="crystal small" style="--w:30px;--x:74%;--y:17%;--opacity:.7;--duration:7s;--delay:-1s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="50,4 96,87 7,77"/><polygon class="facet3" points="50,4 7,77 48,65"/><polygon class="facet2" points="50,4 48,65 96,87"/></svg></div>
<div class="crystal small" style="--w:25px;--x:32%;--y:76%;--opacity:.5;--duration:9s;--delay:-5s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="50,3 98,92 6,77"/><polygon class="facet3" points="50,3 6,77 48,61"/><polygon class="facet2" points="50,3 48,61 98,92"/></svg></div>
</div>
<section class="center" aria-label="PRISM home">
<h1 class="logo" aria-label="PRISM"><span>P</span><span>R</span><span>I</span><span>S</span><span>M</span></h1>
<form class="search" id="searchForm" role="search">
<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16 16 4.2 4.2"/></svg>
<input id="search" type="search" placeholder="Search for a game..." autocomplete="off" aria-label="Search for a game">
<button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</form>
<div class="feedback" id="feedback" aria-live="polite"></div>
</section>
</main>
<script>
const stars=document.getElementById("stars");
for(let i=0;i<48;i++){const star=document.createElement("span");star.className="star";star.style.setProperty("--x",Math.random()*100+"%");star.style.setProperty("--y",Math.random()*100+"%");star.style.setProperty("--size",(Math.random()*2+1)+"px");star.style.setProperty("--duration",(2.5+Math.random()*6)+"s");star.style.setProperty("--delay",(-Math.random()*8)+"s");stars.appendChild(star)}
const form=document.getElementById("searchForm"),input=document.getElementById("search"),feedback=document.getElementById("feedback");
form.addEventListener("submit",event=>{event.preventDefault();const query=input.value.trim().toLowerCase();if(!query){input.focus();return}if(/trap.?the.?cat|chat.?trap|cat trap/.test(query)){window.location.href="games/trap-the-cat.html";return}feedback.textContent='No offline game found. Try “Trap the Cat”.';feedback.classList.add("show")});
input.addEventListener("input",()=>feedback.classList.remove("show"));
document.addEventListener("keydown",event=>{const target=event.target;const typing=target instanceof HTMLElement&&(target.matches("input, textarea, select")||target.isContentEditable);if(event.key==="/"&&!typing){event.preventDefault();input.focus()}if(event.key==="Escape"){input.value="";feedback.classList.remove("show");input.blur()}});
const navButtons=[...document.querySelectorAll("[data-section]")];
const center=document.querySelector(".center");
navButtons.forEach(button=>button.addEventListener("click",()=>{
  const section=button.dataset.section;
  let page=document.getElementById("pageView");
  if(section==="Home"){
    center.hidden=false;
    if(page) page.hidden=true;
  }else{
    if(!page){
      page=document.createElement("section");
      page.id="pageView";
      page.className="page-view";
      page.setAttribute("aria-live","polite");
      page.hidden=true;
      page.innerHTML='<p class="page-kicker"><span id="pageSectionName">SECTION</span></p><h1 class="page-title" id="pageTitle">Section</h1><div class="page-rule"></div><div class="empty-state"><div class="empty-mark" aria-hidden="true">—</div><h2>Page empty for now</h2><p>This section is still being built. Check back later for updates.</p></div>';
      document.querySelector(".scene").appendChild(page);
    }
    page.querySelector("#pageSectionName").textContent=section.toUpperCase();
    page.querySelector("#pageTitle").textContent=section;
    center.hidden=true;
    page.hidden=false;
  }
  navButtons.forEach(tab=>{
    const selected=tab===button;
    tab.classList.toggle("active",selected);
    if(selected) tab.setAttribute("aria-current","page");
    else tab.removeAttribute("aria-current");
  });
}));
</script>
</body>
</html>

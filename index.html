<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<title>PRISM</title>
<style>
:root{--bg:#030303;--fg:#f7f7f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Arial,sans-serif}body{min-height:100svh;overflow:hidden}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:5px}
.scene{position:relative;isolation:isolate;width:100%;min-height:100svh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 44%,#151515 0%,#090909 31%,#030303 73%)}
.ambient{position:absolute;inset:0;z-index:-2;overflow:hidden;pointer-events:none}.haze{position:absolute;width:45vw;height:45vw;border-radius:50%;background:#fff;filter:blur(120px);opacity:.035;animation:hazeDrift 16s ease-in-out infinite alternate}.haze.a{left:-20%;top:-30%}.haze.b{right:-20%;bottom:-35%;animation-delay:-8s}.stars{position:absolute;inset:0}.star{position:absolute;width:var(--size);height:var(--size);left:var(--x);top:var(--y);border-radius:50%;background:white;opacity:.25;box-shadow:0 0 9px 2px #fff2;animation:twinkle var(--duration) ease-in-out var(--delay) infinite alternate}
.trail{position:absolute;width:125vw;height:56vw;min-height:300px;border:1px solid #ffffff16;border-radius:50%;left:-30%;top:-9%;transform:rotate(-23deg);animation:trailFloat 18s ease-in-out infinite alternate}.trail:after{content:"";position:absolute;width:32%;height:1px;left:22%;top:-1px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #fff;animation:lightTravel 8s linear infinite}.trail.two{width:125vw;height:43vw;left:-15%;top:43%;transform:rotate(19deg);animation-duration:23s;animation-direction:alternate-reverse}.trail.two:after{animation-delay:-4s;animation-duration:11s}
.crystal{position:absolute;width:var(--w);aspect-ratio:1;left:var(--x);top:var(--y);opacity:var(--opacity);filter:drop-shadow(0 0 14px #ffffff15);animation:crystalDrift var(--duration) ease-in-out var(--delay) infinite alternate;transform-origin:center}.crystal svg{display:block;width:100%;height:100%;overflow:visible}.crystal polygon,.crystal path{stroke:#e7e7e7;stroke-width:.65;stroke-linejoin:round}.facet1{fill:url(#facetA)}.facet2{fill:url(#facetB)}.facet3{fill:url(#facetC)}.facet4{fill:url(#facetD)}.edge{fill:none;stroke:#fff;stroke-width:.7;opacity:.75}.crystal.small{filter:drop-shadow(0 0 6px #fff3)}
.navbar{position:absolute;z-index:5;top:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(15px,3vw,38px);width:max-content;max-width:94vw;animation:navReveal 1s .4s both}.navbar button{position:relative;padding:8px 0;color:#888;background:transparent;border:0;font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:color .3s ease}.navbar button:after{content:"";position:absolute;bottom:0;left:50%;width:0;height:1px;background:white;transform:translateX(-50%);transition:width .3s ease}.navbar button:hover{color:white}.navbar button:hover:after{width:100%}
.center{position:relative;z-index:2;width:min(700px,88vw);display:flex;flex-direction:column;align-items:center;transform:translateY(-4vh)}.logo{display:flex;justify-content:center;margin:0 0 43px;padding-left:.26em;font-family:"Arial",sans-serif;font-size:clamp(46px,8vw,82px);line-height:1;font-weight:500;letter-spacing:.26em;text-shadow:0 0 9px #fff7,0 0 32px #fff3;animation:logoArrival 1.5s cubic-bezier(.16,1,.3,1) both;user-select:none}.logo span{display:inline-block;animation:letterArrival 1.2s cubic-bezier(.16,1,.3,1) both}.logo span:nth-child(1){animation-delay:.08s}.logo span:nth-child(2){animation-delay:.15s}.logo span:nth-child(3){animation-delay:.22s}.logo span:nth-child(4){animation-delay:.29s}.logo span:nth-child(5){animation-delay:.36s}
.search{position:relative;width:min(670px,100%);height:82px;display:flex;align-items:center;border:1px solid #dedede;border-radius:100px;background:#050505b8;box-shadow:0 0 0 1px #ffffff08,0 0 28px #ffffff08,inset 0 0 25px #ffffff03;backdrop-filter:blur(12px);animation:searchArrival 1.2s .2s cubic-bezier(.16,1,.3,1) both;transition:box-shadow .45s ease,background .45s ease,border-color .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}.search:focus-within{border-color:white;background:#101010e8;box-shadow:0 0 0 5px #ffffff07,0 0 45px #ffffff16,inset 0 0 20px #ffffff05;transform:scale(1.012)}.search-icon{width:22px;height:22px;margin-left:29px;flex:0 0 auto;opacity:.95;transition:transform .3s ease}.search:focus-within .search-icon{transform:scale(1.1)}#search{width:100%;height:100%;padding:0 15px 0 27px;min-width:0;border:0;outline:0;color:white;background:transparent;font-size:16px}#search::placeholder{color:#929292}.go{flex:0 0 auto;width:54px;height:54px;margin-right:9px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff22;background:#ffffff0b;cursor:pointer;transition:background .3s ease,transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s ease}.go svg{width:23px;height:23px;transition:transform .3s ease}.go:hover{background:white;border-color:white;transform:rotate(-4deg)}.go:hover svg{stroke:#050505;transform:translateX(2px)}.go:active{transform:scale(.9)}
.feedback{position:absolute;top:calc(100% + 18px);left:0;width:100%;color:#aaa;text-align:center;font-size:12px;line-height:1.7;opacity:0;transform:translateY(-5px);pointer-events:none;transition:opacity .3s ease,transform .3s ease}.feedback.show{opacity:1;transform:translateY(0)}
@keyframes logoArrival{from{opacity:0;filter:blur(14px);transform:translateY(20px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes letterArrival{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes searchArrival{from{opacity:0;filter:blur(7px);transform:translateY(17px) scale(.97)}to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}@keyframes navReveal{from{opacity:0;translate:0 -8px}to{opacity:1;translate:0 0}}@keyframes twinkle{from{opacity:.08;transform:scale(.65)}to{opacity:.8;transform:scale(1.5)}}@keyframes hazeDrift{from{transform:translate(-5%,-4%) scale(.8)}to{transform:translate(14%,12%) scale(1.15)}}@keyframes trailFloat{from{margin-left:-1.5%;margin-top:-1%}to{margin-left:2%;margin-top:2%}}@keyframes lightTravel{from{transform:translateX(-60vw);opacity:0}15%{opacity:.8}85%{opacity:.8}to{transform:translateX(100vw);opacity:0}}@keyframes crystalDrift{from{translate:-8px -10px;rotate:-5deg}to{translate:12px 15px;rotate:6deg}}
@media(max-width:600px){.navbar{top:20px;gap:clamp(10px,3.2vw,17px)}.navbar button{font-size:10px;letter-spacing:0}.center{width:88vw;transform:translateY(-3vh)}.logo{font-size:clamp(37px,9vw,54px);margin-bottom:34px;letter-spacing:.2em}.search{height:64px}.search-icon{margin-left:21px;width:20px;height:20px}#search{padding-left:16px;font-size:14px}.go{width:44px;height:44px;margin-right:7px}.crystal{opacity:calc(var(--opacity)*.65)}}@media(max-width:370px){.navbar{gap:9px}.navbar button{font-size:9px}.logo{font-size:35px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="scene">
<nav class="navbar" aria-label="Main navigation">
<button type="button" data-section="Games">Games</button><button type="button" data-section="Apps">Apps</button><button type="button" data-section="Chat">Chat</button><button type="button" data-section="Settings">Settings</button><button type="button" data-section="Account">Account</button><button type="button" data-section="AI">AI</button>
</nav>
<div class="ambient" aria-hidden="true">
<div class="haze a"></div><div class="haze b"></div><div class="trail"></div><div class="trail two"></div><div class="stars" id="stars"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
<linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#aaa" stop-opacity=".02"/></linearGradient>
<linearGradient id="facetC" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ddd" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".65"/></linearGradient>
<linearGradient id="facetD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".02"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
</defs></svg>
<div class="crystal" style="--w:310px;--x:75%;--y:-9%;--opacity:.68;--duration:13s;--delay:-3s"><svg viewBox="0 0 200 200"><polygon class="facet1" points="100,4 195,120 122,145"/><polygon class="facet2" points="100,4 122,145 24,128"/><polygon class="facet3" points="100,4 24,128 70,190"/><polygon class="facet4" points="24,128 122,145 70,190"/><polygon class="facet2" points="122,145 195,120 70,190"/><path class="edge" d="M100 4 122 145 24 128 100 4 70 190 122 145 195 120"/></svg></div>
<div class="crystal" style="--w:330px;--x:-10%;--y:54%;--opacity:.48;--duration:17s;--delay:-6s"><svg viewBox="0 0 200 200"><polygon class="facet1" points="0,20 185,100 90,145"/><polygon class="facet3" points="0,20 90,145 20,195"/><polygon class="facet2" points="185,100 90,145 140,195"/><polygon class="facet4" points="90,145 20,195 140,195"/><path class="edge" d="M0 20 185 100 90 145 20 195 0 20 M90 145 140 195 185 100"/></svg></div>
<div class="crystal small" style="--w:88px;--x:18%;--y:18%;--opacity:.62;--duration:8s;--delay:-2s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="50,3 96,75 58,65"/><polygon class="facet3" points="50,3 58,65 4,76"/><polygon class="facet2" points="4,76 58,65 40,97"/><path class="edge" d="M50 3 58 65 4 76 50 3 40 97 58 65 96 75"/></svg></div>
<div class="crystal small" style="--w:66px;--x:79%;--y:72%;--opacity:.65;--duration:10s;--delay:-4s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="8,26 91,13 65,88"/><polygon class="facet3" points="8,26 65,88 18,76"/><polygon class="facet2" points="91,13 65,88 18,76"/><path class="edge" d="M8 26 91 13 65 88 18 76 8 26"/></svg></div>
<div class="crystal small" style="--w:30px;--x:74%;--y:17%;--opacity:.7;--duration:7s;--delay:-1s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="50,4 96,87 7,77"/><polygon class="facet3" points="50,4 7,77 48,65"/><polygon class="facet2" points="50,4 48,65 96,87"/></svg></div>
<div class="crystal small" style="--w:25px;--x:32%;--y:76%;--opacity:.5;--duration:9s;--delay:-5s"><svg viewBox="0 0 100 100"><polygon class="facet1" points="50,3 98,92 6,77"/><polygon class="facet3" points="50,3 6,77 48,61"/><polygon class="facet2" points="50,3 48,61 98,92"/></svg></div>
</div>
<section class="center" aria-label="PRISM home">
<h1 class="logo" aria-label="PRISM"><span>P</span><span>R</span><span>I</span><span>S</span><span>M</span></h1>
<form class="search" id="searchForm" role="search">
<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16 16 4.2 4.2"/></svg>
<input id="search" type="search" placeholder="Search for a game..." autocomplete="off" aria-label="Search for a game">
<button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</form>
<div class="feedback" id="feedback" aria-live="polite"></div>
</section>
</main>
<script>
const stars=document.getElementById("stars");
for(let i=0;i<48;i++){const star=document.createElement("span");star.className="star";star.style.setProperty("--x",Math.random()*100+"%");star.style.setProperty("--y",Math.random()*100+"%");star.style.setProperty("--size",(Math.random()*2+1)+"px");star.style.setProperty("--duration",(2.5+Math.random()*6)+"s");star.style.setProperty("--delay",(-Math.random()*8)+"s");stars.appendChild(star)}
const form=document.getElementById("searchForm"),input=document.getElementById("search"),feedback=document.getElementById("feedback");
form.addEventListener("submit",event=>{event.preventDefault();const query=input.value.trim().toLowerCase();if(!query){input.focus();return}if(/trap.?the.?cat|chat.?trap|cat trap/.test(query)){window.location.href="games/trap-the-cat.html";return}feedback.textContent='No offline game found. Try “Trap the Cat”.';feedback.classList.add("show")});
input.addEventListener("input",()=>feedback.classList.remove("show"));
document.addEventListener("keydown",event=>{const target=event.target;const typing=target instanceof HTMLElement&&(target.matches("input, textarea, select")||target.isContentEditable);if(event.key==="/"&&!typing){event.preventDefault();input.focus()}if(event.key==="Escape"){input.value="";feedback.classList.remove("show");input.blur()}});
document.querySelectorAll("[data-section]").forEach(button=>button.addEventListener("click",()=>{/* Destinations intentionally blank for now. */}));
</script>
</body>
</html>
